[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "x-follow-list"
version = "0.1.0"
description = "Self-hosted X relationship monitoring"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21,<1",
  "alembic>=1.16,<2",
  "fastapi>=0.141.1,<0.142",
  "openpyxl>=3.1,<4",
  "playwright==1.62.0",
  "pydantic>=2.12,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
x-follow-list-api = "x_follow_list.api.app:main"
x-follow-list-worker = "x_follow_list.worker.runtime:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -p no:cacheprovider"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["x_follow_list"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
exclude = [".mypy_cache", ".ruff_cache", ".venv", "pytest-cache-files-*", "web"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"src/x_follow_list/application/snapshots.py" = ["E501"] # Long SQL is kept searchable.
"tests/integration/test_snapshot_commit.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["x_follow_list"]
