services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    command: ["python", "-m", "uvicorn", "x_follow_list.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    volumes:
      - application-data:/var/lib/x-follow-list # SQLite and generated artifacts
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    command: ["x-follow-list-worker"]
    env_file: .env
    volumes:
      - application-data:/var/lib/x-follow-list
      - browser-profiles:/var/lib/x-follow-list/profiles
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  application-data:
  browser-profiles:
